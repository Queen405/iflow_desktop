[project]
name = "iflow-desktop"
version = "0.2.0"
description = "iFlow CLI 桌面客户端 - 基于 PySide6 的图形化界面"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
iflow-desktop = "iflow_desktop.app:main"

[project.gui-scripts]
iflow-desktop-gui = "iflow_desktop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iflow_desktop"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
